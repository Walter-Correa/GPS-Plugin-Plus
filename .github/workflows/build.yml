name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"

jobs:
  build-windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: cmake -B build -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/plugins | Out-Null
          New-Item -ItemType Directory -Force -Path package/components | Out-Null
          New-Item -ItemType Directory -Force -Path package/include | Out-Null
          New-Item -ItemType Directory -Force -Path package/scriptfiles | Out-Null

          # Copy Plugin
          $pluginDll = Get-ChildItem -Path "build" -Filter "GPS.dll" -Recurse | Where-Object { $_.FullName -notmatch "components" } | Select-Object -First 1
          if ($pluginDll) {
            Copy-Item $pluginDll.FullName "package/plugins/GPS.dll" -Force
          }

          # Copy Component
          $compDll = Get-ChildItem -Path "build" -Filter "GPS.dll" -Recurse | Where-Object { $_.FullName -match "components" } | Select-Object -First 1
          if ($compDll) {
            Copy-Item $compDll.FullName "package/components/GPS.dll" -Force
          }

          # Copy Includes, Data, Examples and License (no README.md)
          if (Test-Path "GPS.inc") { Copy-Item "GPS.inc" "package/include/GPS.inc" -Force }
          if (Test-Path "GPS.dat") { Copy-Item "GPS.dat" "package/scriptfiles/GPS.dat" -Force }
          if (Test-Path "Example.pwn") { Copy-Item "Example.pwn" "package/Example.pwn" -Force }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "package/LICENSE" -Force }

      - name: Verify Windows Static Runtime
        shell: pwsh
        run: |
          foreach ($file in @("package/plugins/GPS.dll", "package/components/GPS.dll")) {
            if (-not (Test-Path $file)) {
              throw "Expected binary $file does not exist!"
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($ascii -match "MSVCP\d+\.dll" -or $ascii -match "VCRUNTIME\d+\.dll") {
              throw "Verification failed: $file depends on dynamic MSVC runtime (MSVCP/VCRUNTIME)!"
            }
          }
          Write-Host "Windows static runtime verification passed: 0 MSVCP/VCRUNTIME dependencies."

      - name: Compress Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path package/* -DestinationPath dist/GPS-Plugin-Plus-Windows.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GPS-Plugin-Plus-Windows
          path: dist/GPS-Plugin-Plus-Windows.zip

  build-linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Build inside debian:buster container
        run: |
          docker run --rm -v "${PWD}:/workspace" -w /workspace debian:buster bash -c "
            set -e
            sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list
            sed -i 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list
            sed -i '/buster-updates/d' /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y --no-install-recommends ca-certificates curl g++-multilib gcc-multilib make zip binutils
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz | tar --strip-components=1 -xz -C /usr/local
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
          "

      - name: Prepare Package
        run: |
          mkdir -p package/plugins package/components package/include package/scriptfiles

          # Copy Plugin
          PLUGIN_SO=$(find build -name "GPS.so" | grep -v "components" | head -n 1)
          if [ -n "$PLUGIN_SO" ]; then
            cp "$PLUGIN_SO" "package/plugins/GPS.so"
          fi

          # Copy Component
          COMP_SO=$(find build -name "GPS.so" | grep "components" | head -n 1)
          if [ -n "$COMP_SO" ]; then
            cp "$COMP_SO" "package/components/GPS.so"
          fi

          # Copy Includes, Data, Examples and License (no README.md)
          [ -f "GPS.inc" ] && cp "GPS.inc" "package/include/GPS.inc"
          [ -f "GPS.dat" ] && cp "GPS.dat" "package/scriptfiles/GPS.dat"
          [ -f "Example.pwn" ] && cp "Example.pwn" "package/Example.pwn"
          [ -f "LICENSE" ] && cp "LICENSE" "package/LICENSE"

      - name: Verify Linux Compatibility and Exports
        run: |
          set -e
          for so in package/plugins/GPS.so package/components/GPS.so; do
            if [ ! -f "$so" ]; then
              echo "Error: $so not found!"
              exit 1
            fi
            # Must not require GLIBCXX (statically linked libstdc++)
            if objdump -T "$so" | grep "GLIBCXX_"; then
              echo "Verification failed: $so depends on GLIBCXX_!"
              exit 1
            fi
            # Must not require GLIBC >= 2.29
            if objdump -T "$so" | grep -E "GLIBC_2\.(29|3[0-9])"; then
              echo "Verification failed: $so requires GLIBC >= 2.29!"
              exit 1
            fi
          done

          # Verify symbol visibility for plugin: only expected exported symbols
          UNEXPECTED_PLUGIN=$(nm -D --defined-only package/plugins/GPS.so | awk '{print $3}' | grep -v -E "^(Supports|Load|Unload|AmxLoad|AmxUnload|ProcessTick)$" || true)
          if [ -n "$UNEXPECTED_PLUGIN" ]; then
            echo "Verification failed: GPS.so exports unexpected symbols:"
            echo "$UNEXPECTED_PLUGIN"
            exit 1
          fi

          # Verify symbol visibility for component: only ComponentEntryPoint
          UNEXPECTED_COMP=$(nm -D --defined-only package/components/GPS.so | awk '{print $3}' | grep -v -E "^ComponentEntryPoint$" || true)
          if [ -n "$UNEXPECTED_COMP" ]; then
            echo "Verification failed: components/GPS.so exports unexpected symbols:"
            echo "$UNEXPECTED_COMP"
            exit 1
          fi

          echo "Linux verification passed: glibc <= 2.28, static libstdc++, strictly hidden symbols."

      - name: Compress Package
        run: |
          mkdir -p dist
          (cd package && zip -r ../dist/GPS-Plugin-Plus-Linux.zip .)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GPS-Plugin-Plus-Linux
          path: dist/GPS-Plugin-Plus-Linux.zip
