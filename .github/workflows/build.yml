name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"

jobs:
  build-windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: cmake -B build -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/plugins | Out-Null
          New-Item -ItemType Directory -Force -Path package/components | Out-Null
          New-Item -ItemType Directory -Force -Path package/include | Out-Null
          New-Item -ItemType Directory -Force -Path package/scriptfiles | Out-Null

          # Copy Plugin
          $pluginDll = Get-ChildItem -Path "build" -Filter "GPS.dll" -Recurse | Where-Object { $_.FullName -notmatch "components" } | Select-Object -First 1
          if ($pluginDll) {
            Copy-Item $pluginDll.FullName "package/plugins/GPS.dll" -Force
          }

          # Copy Component
          $compDll = Get-ChildItem -Path "build" -Filter "GPS.dll" -Recurse | Where-Object { $_.FullName -match "components" } | Select-Object -First 1
          if ($compDll) {
            Copy-Item $compDll.FullName "package/components/GPS.dll" -Force
          }

          # Copy Includes, Data, Examples and Docs
          if (Test-Path "GPS.inc") { Copy-Item "GPS.inc" "package/include/GPS.inc" -Force }
          if (Test-Path "GPS.dat") { Copy-Item "GPS.dat" "package/scriptfiles/GPS.dat" -Force }
          if (Test-Path "Example.pwn") { Copy-Item "Example.pwn" "package/Example.pwn" -Force }
          if (Test-Path "README.md") { Copy-Item "README.md" "package/README.md" -Force }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "package/LICENSE" -Force }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Plugin-Plus-Windows
          path: package/

  build-linux-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install 32-bit Multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32" -DCMAKE_MODULE_LINKER_FLAGS="-m32"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Package
        run: |
          mkdir -p package/plugins package/components package/include package/scriptfiles

          # Copy Plugin
          PLUGIN_SO=$(find build -name "GPS.so" | grep -v "components" | head -n 1)
          if [ -n "$PLUGIN_SO" ]; then
            cp "$PLUGIN_SO" "package/plugins/GPS.so"
          fi

          # Copy Component
          COMP_SO=$(find build -name "GPS.so" | grep "components" | head -n 1)
          if [ -n "$COMP_SO" ]; then
            cp "$COMP_SO" "package/components/GPS.so"
          fi

          # Copy Includes, Data, Examples and Docs
          [ -f "GPS.inc" ] && cp "GPS.inc" "package/include/GPS.inc"
          [ -f "GPS.dat" ] && cp "GPS.dat" "package/scriptfiles/GPS.dat"
          [ -f "Example.pwn" ] && cp "Example.pwn" "package/Example.pwn"
          [ -f "README.md" ] && cp "README.md" "package/README.md"
          [ -f "LICENSE" ] && cp "LICENSE" "package/LICENSE"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Plugin-Plus-Linux
          path: package/

  create-release:
    needs: [build-windows-release, build-linux-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: GPS-Plugin-Plus-Windows
          path: release-win

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: GPS-Plugin-Plus-Linux
          path: release-linux

      - name: Create Zip Archives
        run: |
          mkdir -p dist
          (cd release-win && zip -r ../dist/GPS-Plugin-Plus-Windows.zip .)
          (cd release-linux && zip -r ../dist/GPS-Plugin-Plus-Linux.zip .)
          cp GPS.inc dist/GPS.inc
          cp GPS.dat dist/GPS.dat

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GPS-Plugin-Plus-Windows.zip
            dist/GPS-Plugin-Plus-Linux.zip
            dist/GPS.inc
            dist/GPS.dat
          generate_release_notes: true
